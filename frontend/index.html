<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keydrop | Bienvenida</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="min-vh-100 d-flex align-items-center justify-content-center bg-dark text-white">
        <section class="container text-center">
            <img src="logo/loot_logo_sin_tagline.png" alt="Logo Keydrop" class="mb-4" style="max-width: 220px;">

            <h1 class="mb-3 h1">Bienvenido a LOOT</h1>
            <p class="mb-4 h2">Un gusto encontrarte por aca!</p>
            <p class="mb-4 h3">Ingresa tu nombre para ver los productos!</p>

            <form id="form-bienvenida" class="mx-auto" style="max-width: 420px;">
                <label for="nombreUsuario" class="form-label h4">Nombre</label>
                <input 
                    type="text" 
                    id="nombreUsuario" 
                    class="form-control mb-3" 
                    placeholder="Ej: Johann"
                    required
                >

                <button type="submit" class="btn btn-warning w-100">
                    Continuar
                </button>
            </form>
        </section>
    </main>

    <script src="./js/bienvenida.js"></script>
</body>
</html>
