<!DOCTYPE html>
<html lang="es">

<head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keydrop</title>

    <!-- Importacion de GoogleFonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">

    <!-- Importacion de archivo CSS (Estilos) -->
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/ticket.css">

</head>

<body>

    <!-- Encabezado -->
    <header>


        <nav class="navbar navbar-expand-lg navbar-dark py-3">
            <div class="container-fluid position-relative">


                <!-- Contenido central -->
                <div class="mx-auto text-center">

                    <!-- Logo centrado -->
                    <a class="navbar-brand d-block mx-auto mb-0" href="index.html">
                        <img id="icono-principal" src="logo/loot_logo_sin_tagline.png" alt="Logo Keydrop" >
                    </a>

                </div>   
            </div>
        </nav>

    </header>

    <!-- Contenido principal de la pagina -->
    <main>
        
        <section class="ticket-container container py-5 border-danger bg-success">
            <h1>Ticket de compra</h1>

            <p id="ticket-nombre"></p>
            <p id="ticket-fecha"></p>

            <table id="tabla-ticket" class="table table-dark table-bordered table-striped w-auto">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Subtotal</th>
                </tr>
            </table>

            <h2 id="ticket-total"></h2>

            <button id="btn-descargar-pdf" class="btn btn-warning">Descargar PDF</button>
        </section>

    </main>

    <footer>
        <p class="fs-6 mt-0 p-2">Todos los derechos reservados | Keydrop 2026</p>
    </footer>

    <!-- Importacion de archivo JS (Comportamiento) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
    <script src="./js/ticket.js"></script>
    

</body>

</html>
