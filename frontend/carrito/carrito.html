<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito</title>

    <!-- Importacion de GoogleFonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
        
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

                        <div class="collapse navbar-collapse justify-content-center" id="navbarCatalogo">

                                    <a class="nav-link" aria-current="page" href="../index.html">Inicio</a>
                                </li>

                                <li class="nav-item dropdown">
                                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownProductos" role="button"

                                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDropdownProductos">

                                        <li>

                                    <a class="nav-link" href="#skins">Godoy</a>
                                </li>

                            </ul>

                    </div>

                        <!-- Login admin -->
                        <a class="navbar-brand m-0" href="http://localhost:3000/login" title="Iniciar sesión admin">

                        <!-- Carrito -->
                        <a class="navbar-brand m-0" href="carrito.html" title="Carrito">

    <main>

            <table id="tabla-carrito">

                    <td class="celda-header-tabla-carrito">Cantidad</td>
                    <td class="celda-header-tabla-carrito">Precio unitario</td>
                </tr>
            </table>
        </div>
